<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel guide</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="start">
      <header class="header">
        <div class="header-wrapper">
          <div class="header-logo">
            <img src="img/logo.svg" alt="" width="45" height="30" />
            <p>Малая родина</p>
          </div>
          <nav class="header-nav">
            <a href="" class="header-nav__link">Главная</a>
            <a href="" class="header-nav__link">Маршрут</a>
            <a href="" class="header-nav__link">О нас</a>
          </nav>
        </div>
      </header>
      <div class="hero">
        <div class="hero-wrapper">
          <p class="hero-caption">добро пожаловать</p>
          <h1 class="hero-title">По следам<br />времени</h1>
          <p class="hero-caption">Туристически маршрут по малой родине.</p>
          <p class="hero-caption">Десять мест, связанных одной историей.</p>
          <button class="hero-btn">
            Открыть маршрут<svg
              width="36"
              height="24"
              viewBox="0 0 36 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M2 12H32M26 6L32 12L26 18"
                stroke="white"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="footer">
        <div class="footer-wrapper">
          <p class="footer-wrapper_au">О нас</p>
          <p class="footer-wrapper__inf">Мы - команда учебного проекта. Исследуем регион и собираем истории его мест.</p>
          <p class="footer-wrapper__inf">Учебный проект</p>
        </div>
      </div>
    </section>
  </body>
</html>
